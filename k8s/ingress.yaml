apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: intent-classifier-ingress
  namespace: intent-classifier
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  ingressClassName: traefik
  rules:
  - host: example.com
    http:
      paths:
      - pathType: Prefix
        path: "/predict"
        backend:
          service:
            name: intent-classifier-service
            port: 
              number: 80
