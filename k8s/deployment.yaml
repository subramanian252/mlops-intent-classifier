apiVersion: apps/v1
kind: Deployment
metadata:
  name: intent-classifier-deployment
  namespace: intent-classifier
  labels:
    app: intent-classifier
spec:
  replicas: 2
  selector:
    matchLabels:
      app: intent-classifier
  template:
    metadata:
      labels:
        app: intent-classifier
    spec:
      containers:
      - name: intent-classifier-pod
        image: 894461833260.dkr.ecr.eu-north-1.amazonaws.com/mlops:latest
        ports:
        - containerPort: 6000
